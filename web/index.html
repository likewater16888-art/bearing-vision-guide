<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成品轴承视觉检测 · 调试速查与教学</title>
<meta name="description" content="成品轴承视觉检测设备调试速查与教学：外径 / 内径 / 端面工位的阶段成像、检测项、参数区间、跑马灯设置与误判漏检案例，含覆盖手册 519 节的课程、分维练习、抽考与错题本，支持全文搜索。">
<link rel="stylesheet" href="assets/style.css?v=1.4">
</head>
<body>

<header class="topbar">
  <div class="brand">成品轴承视觉检测<span>调试速查</span></div>
  <div class="searchwrap">
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="搜索：端面 阶段二 / 跑马灯 / 内径识别区域偏移 / 倒角磕碰 …（按 / 聚焦）">
    <button id="qclear" type="button" title="清空" hidden>×</button>
  </div>
  <div class="mach">
    <label for="machine">机型</label>
    <select id="machine"></select>
  </div>
</header>

<div id="results" class="results" hidden></div>

<main class="layout">
  <aside class="sidebar" id="side"></aside>
  <section class="content" id="view">
    <div class="card">
      <h2>正在加载知识库…</h2>
      <p class="note">首次打开需要生成数据文件：在项目根目录运行
        <code>python tools/build_web_data.py</code>，再运行 <code>node tools/build_learn.js</code>（教学模块），
        然后确认 <code>web/data/manual.js</code>、<code>web/data/images.js</code>、<code>web/data/learn.js</code>
        与 <code>web/images/</code> 均已生成。</p>
      <noscript><p>本页面需要启用 JavaScript。</p></noscript>
    </div>
  </section>
</main>

<div id="lightbox" hidden>
  <img alt="">
  <div class="cap"></div>
</div>

<script src="data/knowledge.js?v=1.4"></script>
<script src="data/scenarios.js?v=1.4"></script>
<script src="data/images.js?v=1.4"></script>
<script src="data/manual.js?v=1.4"></script>
<script src="data/learn.js?v=1.4"></script>
<script src="assets/learn.js?v=1.4"></script>
<script src="assets/lite.js?v=1.4"></script>
<script src="assets/app.js?v=1.4"></script>
</body>
</html>
